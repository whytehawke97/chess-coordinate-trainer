<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Coordinate Trainer</title>

<link rel="manifest" href="manifest.json">

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#111827;
    color:white;
    text-align:center;
}

.container{
    max-width:520px;
    margin:auto;
    padding:15px;
}

.board{
    width:min(90vw,450px);
    aspect-ratio:1;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(8,1fr);
}

.square{
    display:flex;
    align-items:center;
    justify-content:center;
}

.light{background:#f0d9b5;}
.dark{background:#b58863;}

.highlight{
    outline:5px solid yellow;
    outline-offset:-5px;
}

select,button{
    width:100%;
    padding:12px;
    margin:6px 0;
    font-size:16px;
}

.stats{
    margin-top:10px;
}

.listening{
    color:#4ade80;
    font-weight:bold;
}

.processing{
    color:#facc15;
}
</style>
</head>
<body>

<div class="container">

<h2>♟ Chess Coordinate Trainer</h2>

<select id="orientation">
    <option value="white">Play as White</option>
    <option value="black">Play as Black</option>
</select>

<select id="mode">
    <option value="endless">Endless</option>
    <option value="30">30 Seconds</option>
    <option value="60">60 Seconds</option>
</select>

<button onclick="startTraining()">Start Training</button>

<div id="status">Ready</div>

<div id="timer"></div>

<div class="board" id="board"></div>

<div class="stats">
    Correct: <span id="correct">0</span><br>
    Attempts: <span id="attempts">0</span><br>
    Accuracy: <span id="accuracy">0%</span><br>
    Current Streak: <span id="streak">0</span><br>
    Best Streak: <span id="bestStreak">0</span>
</div>

</div>

<script>

const files=['a','b','c','d','e','f','g','h'];
const ranks=['1','2','3','4','5','6','7','8'];

let currentSquare=null;
let correct=0;
let attempts=0;
let streak=0;
let timerInterval=null;
let trainingActive=false;

const bestKey='bestStreak';

let bestStreak=
parseInt(localStorage.getItem(bestKey)||0);

document.getElementById('bestStreak').textContent=bestStreak;

function buildBoard(){

const board=document.getElementById('board');
board.innerHTML='';

const white=
document.getElementById('orientation').value==='white';

const fs=white?files:[...files].reverse();
const rs=white?[...ranks].reverse():ranks;

for(const r of rs){
for(const f of fs){

const sq=document.createElement('div');

sq.className=
'square '+
(((files.indexOf(f)+parseInt(r))%2)
?'light':'dark');

sq.dataset.square=f+r;

board.appendChild(sq);

}
}
}

function randomSquare(){

let sq;

do{
sq=
files[Math.floor(Math.random()*8)]
+
ranks[Math.floor(Math.random()*8)];
}
while(sq===currentSquare);

currentSquare=sq;

document.querySelectorAll('.square')
.forEach(x=>x.classList.remove('highlight'));

document
.querySelector(
`[data-square="${sq}"]`
)
.classList.add('highlight');
}

function updateStats(){

document.getElementById('correct').textContent=correct;
document.getElementById('attempts').textContent=attempts;

let acc=
attempts
?Math.round(correct*100/attempts)
:0;

document.getElementById('accuracy')
.textContent=acc+'%';

document.getElementById('streak')
.textContent=streak;

document.getElementById('bestStreak')
.textContent=bestStreak;
}

function normalize(text){

text=text.toLowerCase();

const nums={
one:'1',
two:'2',
three:'3',
four:'4',
five:'5',
six:'6',
seven:'7',
eight:'8'
};

for(const k in nums){
text=text.replaceAll(k,nums[k]);
}

text=text.replace(/\s/g,'');

const m=text.match(/[a-h][1-8]/);

return m?m[0]:text;
}

function nextSquare(){
randomSquare();
}

function handleAnswer(answer){

attempts++;

if(normalize(answer)===currentSquare){

correct++;

streak++;

if(streak>bestStreak){

bestStreak=streak;

localStorage.setItem(
bestKey,
bestStreak
);
}

nextSquare();

}else{

streak=0;

}

updateStats();
}

let recognition;

function startSpeech(){

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;

recognition=new SR();

recognition.lang='en-US';

recognition.continuous=false;

recognition.interimResults=false;

recognition.onstart=()=>{
document.getElementById('status')
.innerHTML=
'<span class="listening">Listening...</span>';
};

recognition.onresult=(e)=>{

const result=
e.results[0][0].transcript;

handleAnswer(result);
};

recognition.onend=()=>{

if(trainingActive){

document.getElementById('status')
.innerHTML=
'<span class="processing">Waiting...</span>';

recognition.start();
}
};

recognition.onerror=()=>{

if(trainingActive){

setTimeout(
()=>recognition.start(),
1000
);

}
};

recognition.start();
}

function finishSession(){

trainingActive=false;

if(recognition){
recognition.stop();
}

clearInterval(timerInterval);

alert(
`Session Complete

Correct: ${correct}
Attempts: ${attempts}
Accuracy: ${
attempts
?Math.round(correct*100/attempts)
:0
}%

Best Streak: ${streak}`
);
}

function startTraining(){

correct=0;
attempts=0;
streak=0;

updateStats();

buildBoard();

nextSquare();

trainingActive=true;

const mode=
document.getElementById('mode').value;

if(mode!=='endless'){

let remaining=
parseInt(mode);

document.getElementById('timer')
.textContent=
remaining+'s';

timerInterval=
setInterval(()=>{

remaining--;

document.getElementById('timer')
.textContent=
remaining+'s';

if(remaining<=0){
finishSession();
}

},1000);

}else{

document.getElementById('timer')
.textContent='∞';

}

startSpeech();
}

buildBoard();

if('serviceWorker' in navigator){
navigator.serviceWorker.register(
'service-worker.js'
);
}

</script>

</body>
</html>
